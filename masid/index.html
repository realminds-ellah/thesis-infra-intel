
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>MASID — Monitoring And Surveillance of Infrastructure Delivery</title>
      <meta name="description" content="Quality monitoring of flood control infrastructure delivery through procurement and satellite data. Case study: DPWH Bulacan 1st District Engineering Office, 1,293 contracts, 2016–2025. Built entirely from public records." />
      <meta name="robots" content="noindex, nofollow" />

      <!--
        Social preview.

        In the Philippines this kind of thing travels on Facebook and Messenger,
        and a link with no card is a link nobody opens. Without these tags a
        shared MASID URL rendered as bare text: no title, no summary, no image.

        The image is generated, not a screenshot of a contract — a card naming a
        real company in a Messenger thread is a claim made on that company's
        behalf by whoever shared it, and the preview should carry the project,
        not an allegation.
      -->
      <meta property="og:type" content="website" />
      <meta property="og:site_name" content="MASID" />
      <meta property="og:title" content="MASID — Monitoring And Surveillance of Infrastructure Delivery" />
      <meta property="og:description" content="1,293 flood control contracts worth ₱67.7B in Bulacan 1st DEO, checked against the public record. Built entirely from open data — DPWH, PhilGEPS, Sentinel-2 and UP NOAH." />
      <meta property="og:url" content="https://masid.vercel.app/" />
      <meta property="og:image" content="https://masid.vercel.app/share.png" />
      <meta property="og:image:width" content="1200" />
      <meta property="og:image:height" content="630" />
      <meta property="og:locale" content="en_PH" />
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:title" content="MASID — flood control, checked against the record" />
      <meta name="twitter:description" content="1,293 contracts, ₱67.7B, one district office. Every figure from public records." />
      <meta name="twitter:image" content="https://masid.vercel.app/share.png" />
      <meta name="theme-color" content="#1e3a7b" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      <!--
        Theme, before the first pixel.

        React applies the theme in an effect, which runs after the browser has
        already painted — so a reader who chose dark got a white flash on every
        load. This runs synchronously in <head>, before <body> exists, and sets
        the same class and color-scheme the app manages afterwards. It is
        deliberately dependency-free and wrapped in try/catch: if localStorage
        throws in private mode, the page must still render.

        Keep the storage key in sync with src/app/theme.ts.
      -->
      <script>
        (function () {
          try {
            var stored = localStorage.getItem("masid.theme.v1");
            var choice = stored === "light" || stored === "dark" ? stored : null;
            var dark = choice
              ? choice === "dark"
              : window.matchMedia("(prefers-color-scheme: dark)").matches;
            var root = document.documentElement;
            if (dark) root.classList.add("dark");
            root.dataset.theme = dark ? "dark" : "light";
            root.style.colorScheme = dark ? "dark" : "light";
          } catch (e) {}
        })();
      </script>
      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
