
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>MASID — Monitoring And Surveillance of Infrastructure Delivery</title>
      <meta name="description" content="Quality monitoring of flood control infrastructure delivery through procurement and satellite data. Case study: DPWH Bulacan 1st District Engineering Office, 1,293 contracts, 2016–2025. Built entirely from public records." />
      <meta name="robots" content="noindex, nofollow" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      <!--
        Theme, before the first pixel.

        React applies the theme in an effect, which runs after the browser has
        already painted — so a reader who chose dark got a white flash on every
        load. This runs synchronously in <head>, before <body> exists, and sets
        the same class and color-scheme the app manages afterwards. It is
        deliberately dependency-free and wrapped in try/catch: if localStorage
        throws in private mode, the page must still render.

        Keep the storage key in sync with src/app/theme.ts.
      -->
      <script>
        (function () {
          try {
            var stored = localStorage.getItem("masid.theme.v1");
            var choice = stored === "light" || stored === "dark" ? stored : null;
            var dark = choice
              ? choice === "dark"
              : window.matchMedia("(prefers-color-scheme: dark)").matches;
            var root = document.documentElement;
            if (dark) root.classList.add("dark");
            root.dataset.theme = dark ? "dark" : "light";
            root.style.colorScheme = dark ? "dark" : "light";
          } catch (e) {}
        })();
      </script>
      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
