# Audit thresholds for the ghost-detection thesis.
# PRE-REGISTER these before scoring any project. Git-commit and cite in the thesis.

imagery_window:
  start:          "2016-01-01"   # NICFI + Sentinel-1/2 give reliable before/after from here
  end:            "2025-06-30"   # last date with settled post-construction imagery
  min_pre_months:  6             # months of imagery required BEFORE the construction window
  min_post_months: 6             # months of imagery required AFTER completion

verifiable_types:                # F3 — big-footprint types detectable at ~5-10 m; others are "unverifiable"
  - dike
  - revetment
  - dredging
  - retarding_basin
  - slope_protection
  - river_control
# NOT verifiable at this resolution (excluded, and reported as an accountability blind spot):
#   thin floodwall, small drainage/culvert, pumping station internals

footprint_floor:                 # F4 — declared size must exceed the satellite's resolution to be seeable
  min_length_m:    100
  min_area_m2:     10000         # ~1 hectare, for area-type works (basins, dredged reaches)

imagery_quality:                 # F5
  max_cloud_pct:   40            # reject before/after scenes cloudier than this (NICFI mosaics mostly clear)
  search_radius_m: 500           # because coordinates are falsified: search THIS far around the declared point

detector:                        # signal thresholds (tune during development, then LOCK)
  optical_change_min:   0.15     # min normalized before/after change to count as "structure appeared"
  sar_coherence_drop_min: 0.20   # min Sentinel-1 coherence loss to count as "construction disturbance"
  # a project scores "likely real" only if BOTH signals clear their thresholds

validation_targets:              # from power/ analysis — how many labels for a credible claim
  min_ghost_labels:      30      # confirmed ghosts (COA ~21 + self-verified)
  min_legit_labels:      30      # confirmed real (self-verified on high-res imagery)
  strong_labels_each:    80      # target for a strong, tight claim

decision:
  go_total_labels:       60      # 30+30 -> AUC 95% CI half-width < 0.10 (publishable-tight)
