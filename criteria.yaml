# Audit thresholds — PRE-REGISTER these before you look at outcomes.
# Changing them after seeing SAR results = p-hacking. Lock this file, git-commit it, cite it in the thesis.

study:
  sar_start:      "2016-07-01"   # Sentinel-1 6-day (S1A+S1B) reliable coverage begins
  study_end:      "2024-12-31"   # last date with settled post-period SAR
  min_pre_months:  12            # F2: months of SAR coverage required BEFORE completion
  min_post_months: 12            # F2: months of SAR coverage required AFTER completion

scale_floor:                     # F3 — keep if ANY of these clears (project is "big enough to see")
  min_cost_php:    5000000       # ₱5M
  min_length_m:    100
  min_protected_km2: 0.25

hydrological_types:              # F4 — allowed project types (normalize DPWH strings to these)
  - dike
  - floodwall
  - revetment
  - drainage
  - dredging
  - retarding_basin
  - slope_protection
  - river_control

catchment:
  snap_max_m:      500           # F5 — max snap distance from project point to a MERIT stream
  min_contrib_km2: 0.5           # F5 — reject if delineated contributing area is implausibly tiny

isolation:                       # F6 — the killer filter
  flow_distance_km: 5.0          # up/downstream flow-distance defining "same hydrological neighborhood"
  # a project is CONTAMINATED if another qualifying project completed within flow_distance_km
  # AND within [completion - min_pre_months, completion + min_post_months]

observability:                   # F7
  min_flood_events: 1            # affected catchment must show >=1 SAR-detected open-water flood
  sar_water_db_threshold: -17    # VV backscatter (dB) below which a pixel is classed as water (tune per scene)

downstream:                      # F8 — spillover subsample
  flow_distance_km: 8.0          # how far downstream to look for exposed population
  min_pop:         500           # WorldPop head-count needed to count a downstream barangay as "exposed"

decision_gates:
  go_direct:        30
  caution_direct:   20
  go_spillover:     40
